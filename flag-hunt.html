<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flag Hunt — Enes Gaming</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚩</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="wrap">
  <div class="topbar"></div>

  <div class="hud">
    <span class="pill">⭐ Score: <b id="score">0</b></span>
    <span class="pill">❓ <b id="qnum">1</b> / <b id="qtotal">10</b></span>
    <span class="pill">🏆 Best: <b id="best">0</b></span>
    <span class="bar"><i id="progress"></i></span>
  </div>

  <div class="card">
    <div class="prompt">
      <img class="flag-img" id="flag" src="" alt="Flag">
      <h2 id="question">Which country is this?</h2>
      <p class="hint" id="hint"></p>
    </div>

    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="center mt" id="endBox" hidden>
      <h2 id="endTitle"></h2>
      <p id="endText"></p>
      <button class="btn green" id="againBtn">Play again 🔁</button>
      <a class="btn ghost" href="hub.html">Game hub</a>
    </div>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
EG.Auth.guard();
EG.buildTopbar("Flag Hunt 🚩", "Flags, countries and capital cities", "hub.html");

var TOTAL = 10;
var round = 0, score = 0, current = null, mode = "flag";
var $ = function (id) { return document.getElementById(id); };

function startGame() {
  round = 0; score = 0;
  $("score").textContent = "0";
  $("best").textContent = EG.Scores.get("flag");
  $("qtotal").textContent = TOTAL;
  $("endBox").hidden = true;
  $("options").hidden = false;
  $("flag").hidden = false;
  nextQuestion();
}

function nextQuestion() {
  if (round >= TOTAL) return endGame();
  round++;
  $("qnum").textContent = round;
  $("progress").style.width = ((round - 1) / TOTAL * 100) + "%";
  $("feedback").textContent = "";
  $("feedback").className = "feedback";

  current = EG.shuffle(COUNTRIES)[0];
  // every third question asks for the capital instead of the country
  mode = (round % 3 === 0) ? "capital" : "flag";

  $("flag").src = "https://flagcdn.com/w320/" + current.code + ".png";
  $("flag").alt = "Flag of " + current.name;

  var wrong, choices, label;
  if (mode === "flag") {
    $("question").textContent = "Which country is this flag from?";
    $("hint").textContent = "Continent: " + current.continent;
    label = function (c) { return c.name; };
  } else {
    $("question").textContent = "What is the capital of " + current.name + "?";
    $("hint").textContent = "Look at the flag for a clue!";
    label = function (c) { return c.capital; };
  }

  wrong = EG.pickSome(COUNTRIES.filter(function (c) { return c.code !== current.code; }), 3);
  choices = EG.shuffle([current].concat(wrong));

  var box = $("options");
  box.innerHTML = "";
  choices.forEach(function (c) {
    var b = document.createElement("button");
    b.className = "opt";
    b.textContent = label(c);
    b.dataset.code = c.code;
    b.addEventListener("click", function () { answer(c, b, label); });
    box.appendChild(b);
  });
}

function answer(choice, btn, label) {
  document.querySelectorAll(".opt").forEach(function (b) {
    b.disabled = true;
    if (b.dataset.code === current.code) b.classList.add("correct");
  });

  if (choice.code === current.code) {
    score += 10;
    $("score").textContent = score;
    $("feedback").textContent = "Correct! " + current.name + " — capital: " + current.capital;
    $("feedback").className = "feedback good";
    EG.Sound.good();
  } else {
    btn.classList.add("wrong");
    $("feedback").textContent = "The answer is " + label(current) + " (" + current.name + ").";
    $("feedback").className = "feedback bad";
    EG.Sound.bad();
  }
  EG.speak(mode === "capital" ? current.capital : current.name);
  setTimeout(nextQuestion, 2000);
}

function endGame() {
  $("progress").style.width = "100%";
  $("options").hidden = true;
  $("flag").hidden = true;
  $("question").textContent = "Game over!";
  $("hint").textContent = "";
  $("feedback").textContent = "";

  var isBest = EG.Scores.save("flag", score);
  $("endBox").hidden = false;
  $("endTitle").textContent = "You scored " + score + " points!";
  $("endText").textContent = isBest ? "That is a new best score! 🌟" : "Your best so far is " + EG.Scores.get("flag") + ".";
  $("best").textContent = EG.Scores.get("flag");
  EG.Sound.win();
}

$("againBtn").addEventListener("click", startGame);
startGame();
</script>
</body>
</html>

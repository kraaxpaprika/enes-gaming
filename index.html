<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enes &amp; Fatih Mert Gaming</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="login-wrap">
  <!-- who is playing today? -->
  <div class="login-card" id="whoCard">
    <img class="mascot lg" src="assets/img/mascot.svg" alt="Mascot">
    <h1>Enes &amp; Fatih Mert Gaming</h1>
    <p class="sub">Kim oynuyor? 🎮</p>
    <p class="sub">Puanların ve süren sana özel kaydedilir 🏅</p>
    <div class="who-list" id="whoList"></div>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script>
  var list = document.getElementById("whoList");
  EG.Players.list().forEach(function (p) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "who-btn";
    b.innerHTML = '<span class="e">' + p.emoji + '</span><span class="n">' + p.name + '</span>';
    b.addEventListener("click", function () {
      EG.Sound.good();
      EG.Players.select(p.id);
      location.href = "hub.html";
    });
    list.appendChild(b);
  });
</script>
</body>
</html>

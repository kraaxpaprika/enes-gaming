<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" width="300" height="340" role="img" aria-label="Cartoon mascot: a smiling boy in a red cap and red jersey with a medal">
  <defs>
    <linearGradient id="capG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5232f"/>
      <stop offset="1" stop-color="#c60d18"/>
    </linearGradient>
    <linearGradient id="shirtG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f02630"/>
      <stop offset="1" stop-color="#b90a15"/>
    </linearGradient>
    <linearGradient id="skinG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdcbd"/>
      <stop offset="1" stop-color="#f4bf95"/>
    </linearGradient>
  </defs>

  <!-- body / jersey -->
  <path d="M62 340 C62 268 92 236 150 236 C208 236 238 268 238 340 Z" fill="url(#shirtG)"/>
  <path d="M62 340 C62 300 72 274 92 258 L118 250 L118 340 Z" fill="#d3121d" opacity=".5"/>
  <path d="M182 250 L208 258 C228 274 238 300 238 340 L182 340 Z" fill="#d3121d" opacity=".5"/>
  <!-- collar -->
  <path d="M124 240 C136 258 164 258 176 240 C166 234 134 234 124 240 Z" fill="#8f060f"/>
  <!-- crescent and star on the jersey -->
  <g transform="translate(150,300)" fill="#ffffff" opacity=".9">
    <path d="M-6 0 a16 16 0 1 0 14 -13.8 a13 13 0 1 1 -14 13.8 Z"/>
    <path d="M14 -6 l2.6 5.4 5.9 .8 -4.3 4.2 1 5.9 -5.2 -2.8 -5.2 2.8 1 -5.9 -4.3 -4.2 5.9 -.8 Z"/>
  </g>

  <!-- medal ribbon -->
  <path d="M126 244 L146 300" stroke="#f2f2f2" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M176 244 L156 300" stroke="#f2f2f2" stroke-width="9" fill="none" stroke-linecap="round"/>
  <circle cx="151" cy="312" r="16" fill="#ffc531" stroke="#e0a413" stroke-width="4"/>
  <circle cx="151" cy="312" r="7" fill="#ffe08a"/>

  <!-- neck -->
  <path d="M128 214 h44 v34 h-44 Z" fill="#eeb387"/>

  <!-- ears -->
  <ellipse cx="76" cy="150" rx="13" ry="17" fill="url(#skinG)"/>
  <ellipse cx="224" cy="150" rx="13" ry="17" fill="url(#skinG)"/>

  <!-- face -->
  <path d="M150 62 C204 62 224 100 224 152 C224 206 196 236 150 236 C104 236 76 206 76 152 C76 100 96 62 150 62 Z" fill="url(#skinG)"/>

  <!-- hair fringe -->
  <path d="M84 118 C92 88 116 74 150 74 C184 74 208 88 216 118 C196 106 178 112 160 116 C136 121 108 118 84 118 Z" fill="#3b2415"/>

  <!-- cap -->
  <path d="M76 116 C76 66 108 40 150 40 C192 40 224 66 224 116 C190 104 110 104 76 116 Z" fill="url(#capG)"/>
  <path d="M150 40 C160 40 168 44 168 44 L150 112 L132 44 C132 44 140 40 150 40 Z" fill="#ffffff" opacity=".12"/>
  <circle cx="150" cy="42" r="7" fill="#e30a17" stroke="#a90811" stroke-width="2"/>
  <!-- peak -->
  <path d="M212 112 C252 112 276 128 276 140 C276 152 244 154 208 142 Z" fill="#c60d18"/>
  <text x="150" y="94" text-anchor="middle" font-family="Verdana, Segoe UI, sans-serif" font-size="19" font-weight="bold" fill="#ffffff" letter-spacing="1">TÜRKİYE</text>

  <!-- eyebrows -->
  <path d="M104 142 q18 -10 36 -2" stroke="#3b2415" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M160 140 q18 -8 36 2" stroke="#3b2415" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- eyes -->
  <g class="eyes">
    <ellipse cx="122" cy="164" rx="13" ry="14" fill="#ffffff"/>
    <ellipse cx="178" cy="164" rx="13" ry="14" fill="#ffffff"/>
    <circle cx="124" cy="165" r="7.5" fill="#4b361f"/>
    <circle cx="180" cy="165" r="7.5" fill="#4b361f"/>
    <circle cx="126" cy="162" r="2.6" fill="#ffffff"/>
    <circle cx="182" cy="162" r="2.6" fill="#ffffff"/>
  </g>

  <!-- cheeks -->
  <ellipse cx="104" cy="190" rx="14" ry="9" fill="#ff9a9a" opacity=".55"/>
  <ellipse cx="196" cy="190" rx="14" ry="9" fill="#ff9a9a" opacity=".55"/>

  <!-- nose -->
  <path d="M150 172 q6 12 -2 16" stroke="#dda67c" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- smile -->
  <path d="M124 200 q26 26 52 0 q-26 12 -52 0 Z" fill="#8f3b3b"/>
  <path d="M124 200 q26 24 52 0 Z" fill="#ffffff"/>
  <path d="M124 200 q26 26 52 0" stroke="#8f3b3b" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>

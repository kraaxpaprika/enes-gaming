<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map Explorer — Enes Gaming</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="wrap">
  <div class="topbar"></div>

  <div class="hud">
    <span class="pill">⭐ Score: <b id="score">0</b></span>
    <span class="pill">❓ <b id="qnum">1</b> / <b id="qtotal">10</b></span>
    <span class="pill">🏆 Best: <b id="best">0</b></span>
    <span class="bar"><i id="progress"></i></span>
  </div>

  <div class="card">
    <div class="prompt">
      <h2 id="question">Click the right continent!</h2>
      <p class="hint" id="hint">Tip: every country lives on one continent.</p>
    </div>

    <div class="map-box mt">
      <svg viewBox="0 0 1000 500" role="img" aria-label="Simple world map">
        <!-- North America -->
        <path class="continent" data-name="North America"
          d="M120,120 L200,70 L300,80 L330,120 L300,150 L280,190 L250,210 L235,255 L210,235 L215,195 L175,170 L140,165 Z"/>
        <!-- South America -->
        <path class="continent" data-name="South America"
          d="M265,265 L310,255 L345,285 L340,330 L320,375 L300,425 L280,400 L275,350 L255,315 Z"/>
        <!-- Europe -->
        <path class="continent" data-name="Europe"
          d="M470,120 L520,95 L575,100 L595,130 L570,165 L520,180 L485,165 L465,145 Z"/>
        <!-- Africa -->
        <path class="continent" data-name="Africa"
          d="M480,200 L570,195 L610,225 L600,285 L565,345 L530,385 L505,350 L495,290 L470,245 Z"/>
        <!-- Asia -->
        <path class="continent" data-name="Asia"
          d="M600,105 L700,70 L820,80 L890,115 L880,165 L820,200 L760,215 L700,255 L665,230 L640,185 L610,160 Z"/>
        <!-- Oceania -->
        <path class="continent" data-name="Oceania"
          d="M800,320 L880,305 L930,330 L920,380 L860,400 L810,375 Z"/>
      </svg>
    </div>

    <div class="feedback" id="feedback"></div>
    <div class="center mt" id="endBox" hidden>
      <h2 id="endTitle"></h2>
      <p id="endText"></p>
      <button class="btn green" id="againBtn">Play again 🔁</button>
      <a class="btn ghost" href="hub.html">Game hub</a>
    </div>
  </div>

  <p class="footer-note">The map is simplified on purpose — it is here to learn where the continents are.</p>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
EG.Auth.guard();
EG.buildTopbar("Map Explorer 🌍", "Find the continents of the world", "hub.html");

var TOTAL = 10;
var round = 0, score = 0, target = null, country = null, locked = false;
var $ = function (id) { return document.getElementById(id); };
var shapes = Array.prototype.slice.call(document.querySelectorAll(".continent"));

function startGame() {
  round = 0; score = 0;
  $("score").textContent = "0";
  $("best").textContent = EG.Scores.get("map");
  $("qtotal").textContent = TOTAL;
  $("endBox").hidden = true;
  nextQuestion();
}

function clearShapes() {
  shapes.forEach(function (s) { s.classList.remove("correct", "wrong", "locked"); });
}

function nextQuestion() {
  if (round >= TOTAL) return endGame();
  round++;
  locked = false;
  clearShapes();
  $("qnum").textContent = round;
  $("progress").style.width = ((round - 1) / TOTAL * 100) + "%";
  $("feedback").textContent = "";
  $("feedback").className = "feedback";

  // half the questions name a continent, half name a country
  if (round % 2 === 1) {
    target = EG.shuffle(CONTINENTS)[0];
    country = null;
    $("question").textContent = "Where is " + target + "?";
    $("hint").textContent = "Click the continent on the map.";
  } else {
    country = EG.shuffle(COUNTRIES)[0];
    target = country.continent;
    $("question").textContent = "Which continent is " + country.name + " on?";
    $("hint").textContent = "Capital city: " + country.capital;
  }
  EG.speak($("question").textContent);
}

shapes.forEach(function (shape) {
  shape.addEventListener("click", function () {
    if (locked) return;
    locked = true;
    var picked = shape.dataset.name;
    shapes.forEach(function (s) {
      s.classList.add("locked");
      if (s.dataset.name === target) s.classList.add("correct");
    });

    if (picked === target) {
      score += 10;
      $("score").textContent = score;
      $("feedback").textContent = "Yes! That is " + target + ". 🎉";
      $("feedback").className = "feedback good";
      EG.Sound.good();
    } else {
      shape.classList.add("wrong");
      $("feedback").textContent = "That was " + picked + ". " +
        (country ? country.name + " is on " + target + "." : "This green one is " + target + ".");
      $("feedback").className = "feedback bad";
      EG.Sound.bad();
    }
    setTimeout(nextQuestion, 2000);
  });
});

function endGame() {
  $("progress").style.width = "100%";
  locked = true;
  clearShapes();
  shapes.forEach(function (s) { s.classList.add("locked"); });
  $("question").textContent = "Game over!";
  $("hint").textContent = "";
  $("feedback").textContent = "";

  var isBest = EG.Scores.save("map", score);
  $("endBox").hidden = false;
  $("endTitle").textContent = "You scored " + score + " points!";
  $("endText").textContent = isBest ? "That is a new best score! 🌟" : "Your best so far is " + EG.Scores.get("map") + ".";
  $("best").textContent = EG.Scores.get("map");
  EG.Sound.win();
}

$("againBtn").addEventListener("click", startGame);
startGame();
</script>
</body>
</html>

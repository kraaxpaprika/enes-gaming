<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map Explorer — Enes Gaming</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="wrap">
  <div class="topbar"></div>

  <div class="hud">
    <span class="pill">⭐ Score: <b id="score">0</b></span>
    <span class="pill">❓ <b id="qnum">1</b> / <b id="qtotal">10</b></span>
    <span class="pill">🏆 Best: <b id="best">0</b></span>
    <span class="pill">⏱️ <b id="clock">00:00</b></span>
    <span class="bar"><i id="progress"></i></span>
  </div>

  <div class="card">
    <div class="mascot-row" style="justify-content:flex-start">
      <img class="mascot" id="mascot" src="assets/img/mascot.svg" alt="Mascot" style="width:86px">
      <div class="speech" id="speech">Click the right place on the map!</div>
    </div>

    <div class="prompt mt">
      <h2 id="question">Loading the world…</h2>
      <p class="hint" id="hint">Real borders, straight from map data.</p>
    </div>

    <div class="map-box mt" id="mapBox">
      <div class="map-loading" id="loading">🌍 Loading the world map…</div>
      <svg id="map" role="img" aria-label="World map"></svg>
      <div class="map-tools">
        <button type="button" id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button>
        <button type="button" id="zoomOut" title="Zoom out" aria-label="Zoom out">−</button>
        <button type="button" id="zoomReset" title="Whole map" aria-label="Show the whole map">⤢</button>
      </div>
    </div>
    <div class="map-hint">Pinch or use + / − to zoom, drag to move around.</div>
    <div class="map-credit">Boundaries: Natural Earth (public domain)</div>

    <div class="feedback" id="feedback"></div>

    <div class="center mt" id="endBox" hidden>
      <h2 id="endTitle"></h2>
      <p id="endText"></p>
      <button class="btn green" id="againBtn">Play again 🔁</button>
      <a class="btn ghost" href="hub.html">Game hub</a>
    </div>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/stats.js"></script>
<script src="assets/js/geo.js"></script>
<script src="assets/js/app.js"></script>
<script>
EG.Auth.guard();
EG.buildTopbar("Map Explorer 🌍", "Continents and countries of the world", "hub.html");
EGStats.beginSession("map");
var stopClock = EG.startTimer("clock");

var TOTAL = 10;
var round = 0, score = 0, target = null, country = null, locked = true, layers = null, worldFeatures = [], zoom = null;
var $ = function (id) { return document.getElementById(id); };

/* Natural Earth calls it "Turkey"; we show the official name. */
var NAME_FIX = { "Turkey": "Türkiye" };
function nice(n) { return NAME_FIX[n] || n; }

EGGeo.load("assets/geo/world.json").then(function (data) {
  worldFeatures = data.features;
  layers = EGGeo.render($("map"), worldFeatures, {
    projection: "mercator",
    width: 1000, height: 540, padding: 6,
    className: "land",
    group: function (f) { return f.c; },
    title: function (f) { return nice(f.n); }
  });

  layers.all.forEach(function (p) {
    p.addEventListener("click", function () { onPick(p); });
  });

  zoom = EGGeo.enablePanZoom($("map"), { maxZoom: 10 });
  $("zoomIn").addEventListener("click", zoom.zoomIn);
  $("zoomOut").addEventListener("click", zoom.zoomOut);
  $("zoomReset").addEventListener("click", zoom.reset);

  $("loading").remove();
  startGame();
}).catch(function (e) {
  $("loading").textContent = "Could not load the map data 😕";
  $("question").textContent = "Map not available";
  console.error(e);
});

function startGame() {
  round = 0; score = 0;
  $("score").textContent = "0";
  $("best").textContent = EG.Scores.get("map");
  $("qtotal").textContent = TOTAL;
  $("endBox").hidden = true;
  nextQuestion();
}

function clearMap() {
  layers.all.forEach(function (p) { p.classList.remove("correct", "wrong", "target"); });
  $("mapBox").classList.remove("locked");
}

function nextQuestion() {
  if (round >= TOTAL) return endGame();
  round++;
  locked = false;
  clearMap();
  if (zoom) zoom.reset();
  $("qnum").textContent = round;
  $("progress").style.width = ((round - 1) / TOTAL * 100) + "%";
  $("feedback").textContent = "";
  $("feedback").className = "feedback";

  if (round % 2 === 1) {
    // "Where is Europe?" - any country of that continent counts
    target = EG.shuffle(CONTINENTS)[0];
    country = null;
    $("question").textContent = "Where is " + target + "?";
    $("hint").textContent = "Click any country on that continent.";
  } else {
    // "Which continent is Japan on?"
    country = EG.shuffle(COUNTRIES)[0];
    target = country.continent;
    $("question").textContent = "Which continent is " + country.name + " on?";
    $("hint").textContent = "Capital city: " + country.capital;
  }
  EG.react("idle", "Click the map!");
  EG.speak($("question").textContent);
}

function onPick(path) {
  if (locked || !layers) return;
  locked = true;
  var picked = path.dataset.group;

  (layers.byGroup[target] || []).forEach(function (p) { p.classList.add("correct"); });
  $("mapBox").classList.add("locked");

  var isRight = picked === target;
  if (isRight) {
    score += 10;
    $("score").textContent = score;
    $("feedback").textContent = "Yes! That is " + target + ". 🎉";
    $("feedback").className = "feedback good";
    EG.Sound.good();
    EG.react("good");
  } else {
    (layers.byGroup[picked] || []).forEach(function (p) { p.classList.add("wrong"); });
    $("feedback").textContent = "You clicked " + nice(path.dataset.name) + " — that is " + picked +
      ". " + (country ? country.name + " is on " + target + "." : "The green area is " + target + ".");
    $("feedback").className = "feedback bad";
    EG.Sound.bad();
    EG.react("bad");
  }

  // show exactly where the country in the question is
  if (country) {
    var iso = country.code;
    layers.all.forEach(function (p) { if (p.dataset.iso === iso) p.classList.add("target"); });
  }

  EGStats.answer(isRight);
  setTimeout(nextQuestion, 2300);
}

function endGame() {
  $("progress").style.width = "100%";
  locked = true;
  clearMap();
  $("mapBox").classList.add("locked");
  $("question").textContent = "Game over!";
  $("hint").textContent = "";
  $("feedback").textContent = "";

  var isBest = EGStats.finishRound("map", score, TOTAL);
  $("endBox").hidden = false;
  $("endTitle").textContent = "You scored " + score + " points!";
  $("endText").textContent = isBest ? "That is a new best score! 🌟" : "Your best so far is " + EG.Scores.get("map") + ".";
  $("best").textContent = EG.Scores.get("map");
  EG.Sound.win();
  EG.react("good", isBest ? "New record! 🏆" : "Good game!");
  if (score >= TOTAL * 7) EG.confetti();
}

$("againBtn").addEventListener("click", startGame);
</script>
</body>
</html>
